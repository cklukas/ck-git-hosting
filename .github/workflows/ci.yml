#
# Strict build and complete test suite on Linux (amd64 and arm64, GCC and
# Clang) and macOS (Apple silicon and Intel), plus a real Debian package
# install/remove cycle inside a Debian 13 container.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64, compiler: g++ }
          - { runner: ubuntu-24.04, arch: amd64, compiler: clang++ }
          - { runner: ubuntu-24.04-arm, arch: arm64, compiler: g++ }
          - { runner: ubuntu-24.04-arm, arch: arm64, compiler: clang++ }
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang git curl netcat-openbsd
      - name: Build and test
        run: |
          make BUILD_ROOT="$RUNNER_TEMP" BUILD_DIR="$RUNNER_TEMP/build" CXX="${{ matrix.compiler }}" all check

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          make BUILD_ROOT="$RUNNER_TEMP" BUILD_DIR="$RUNNER_TEMP/build" all check

  debian-package:
    name: Debian 13 package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git curl netcat-openbsd ca-certificates lintian openssh-client
      - name: Build and test
        run: |
          # The suite exercises real permission failures (e.g. an unwritable
          # state file); root ignores permission bits, so it must run as an
          # ordinary user here just as the installed service does. Grant
          # access narrowly: a safe.directory exception (not chown) for the
          # checkout, since later steps still need it as root, and the
          # sticky/world-writable bit only on $RUNNER_TEMP itself (not
          # recursive) so the runner's own files there keep their ownership.
          useradd -m ci
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          chmod 1777 "$RUNNER_TEMP"
          su ci -c "make BUILD_ROOT=\"$RUNNER_TEMP\" BUILD_DIR=\"$RUNNER_TEMP/build\" all check"
      - name: Build packages
        run: |
          sh packaging/build-deb.sh --build-dir "$RUNNER_TEMP/build" --output "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
          lintian --no-tag-display-limit "$RUNNER_TEMP"/dist/*.deb || true
      - name: Install, exercise, and purge the packages
        run: |
          apt-get install -y "$RUNNER_TEMP"/dist/ck-git-hosting_*.deb "$RUNNER_TEMP"/dist/ckgit_*.deb "$RUNNER_TEMP"/dist/ckdocs_*.deb
          id ckgit
          test -x /usr/bin/ck-git-hostingd
          test -x /usr/bin/ck-ci-runnerd
          test -x /usr/lib/ck-git-hosting/hooks/post-receive
          test -f /usr/lib/systemd/system/ck-git-hosting.service
          test -f /usr/lib/systemd/system/ck-ci-runner.service
          test -x /usr/bin/ck-pagesd
          test -f /usr/lib/systemd/system/ck-pages.service
          test -x /usr/bin/ck-git-hosting-deploy
          test -f /usr/lib/systemd/system/ck-git-hosting-deploy.service
          test -f /usr/lib/systemd/system/ck-git-hosting-deploy.timer
          test -d /var/lib/ck-git-hosting/ci-build
          test -d /var/lib/ck-git-hosting/pages
          test -f /etc/ck-git-hosting/authorized_keys
          ck-ci-runnerd --help >/dev/null
          ck-pagesd --help >/dev/null
          ck-git-hostingd --config /etc/ck-git-hosting/server.ini --check
          # A fresh install sets pages_root but leaves pages_http_port
          # commented out; ck-pagesd check (what the unit's ExecCondition
          # runs) must say so, so the service stays inactive rather than
          # restart-loop until an administrator also sets the port. This
          # container has no running systemd to exercise the unit itself
          # (see the maintainer scripts' own [ -d /run/systemd/system ]
          # guard), so the check command is exercised directly instead.
          if ck-pagesd check --config /etc/ck-git-hosting/server.ini; then
            echo "ck-pagesd check unexpectedly succeeded without pages_http_port set" >&2
            exit 1
          fi
          grep -q '^ExecCondition=/usr/bin/ck-pagesd check --config /etc/ck-git-hosting/server.ini$' \
            /usr/lib/systemd/system/ck-pages.service
          # WP10: the deploy timer is installed but, unlike the other three
          # units, never auto-enabled -- opting into automatic deployment
          # means trusting whoever can push a tag with root on this machine,
          # a decision only an administrator makes deliberately. Enabling a
          # unit is exactly the symlink systemctl enable would create; this
          # container has no running systemd (see above) to ask instead.
          test ! -e /etc/systemd/system/timers.target.wants/ck-git-hosting-deploy.timer
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/device"
          ckgit-admin authorized-key --client-id ci-device --public-key "$RUNNER_TEMP/device.pub"
          ckgit-admin create smoke --repo-root /srv/ck-git-hosting/repos --hook-directory /usr/lib/ck-git-hosting/hooks
          test -d /srv/ck-git-hosting/repos/smoke.git
          ckgit --help
          test -x /usr/bin/ckdocs
          ckdocs --version
          apt-get remove -y ck-git-hosting ckgit ckdocs
          test -f /etc/ck-git-hosting/server.ini
          test -d /srv/ck-git-hosting/repos/smoke.git
          apt-get purge -y ck-git-hosting
          test ! -e /etc/ck-git-hosting
          test -d /srv/ck-git-hosting/repos/smoke.git
