#
# Publishes this repository's documentation (ckdocs.yml, README.md, docs/) to
# https://cklukas.github.io/ck-git-hosting/ -- the same documentation source .ckgit/ci.yml's
# own `docs` step publishes on ck-git Pages, for readers who cannot reach the
# LAN. ckdocs is compiled here from source (`make ... all`), not installed
# from a package or downloaded, so this workflow has no dependency on any
# release having been cut; ci.yml's own `make all check` (which runs
# tests/integration/docs_site.sh) already fails a broken docs link before it
# ever reaches this workflow. Both pipelines render the web tour from isolated
# example repositories before building the site.

name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git curl python3
      - name: Build tools and render the web tour
        run: |
          make BUILD_ROOT="$RUNNER_TEMP" BUILD_DIR="$RUNNER_TEMP/build" all
          TMPDIR="$RUNNER_TEMP" \
          CKGIT_ADMIN="$RUNNER_TEMP/build/bin/ckgit-admin" \
          CKGIT_HOSTINGD="$RUNNER_TEMP/build/bin/ck-git-hostingd" \
          CK_CI_RUNNER="$RUNNER_TEMP/build/bin/ck-ci-runnerd" \
          CKGIT_POST_RECEIVE="$RUNNER_TEMP/build/hooks/post-receive" \
            sh scripts/docs-web-screenshots.sh "$PWD/docs/images"
          "$RUNNER_TEMP/build/bin/ckdocs" build --root "$PWD" --out "$RUNNER_TEMP/site" --strict
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
