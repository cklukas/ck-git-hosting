# ck-git-hosting builds and self-deploys through its own CI runner.
#
# Every push to master runs the full build and test suite: `make check`, the
# unit binary plus every tests/integration/*.sh script, including the ones
# that need loopback networking (the runner brings the sandbox's isolated
# network namespace's loopback interface up for exactly this; the LAN stays
# denied). Pushing a deploy-* tag does the same and, because a tag build
# publishes a durable release, attaches the built Debian packages as release
# assets. An administrator runs the packaged `ck-git-hosting-deploy` command
# by hand on the server to install a release's server package and restart the
# services, with a health check and automatic rollback; see
# docs/operations/04-ci-cd.md. The CI step itself stays unprivileged: it only
# builds, tests, and packages.
version: 1
on:
  branches: [master]
  tags: [deploy-*]
jobs:
  - name: build-test-package
    steps:
      - name: build
        script: |
          # Stamp a reliable version into the binaries. The sandbox checkout has
          # no .git, so the Makefile's `git describe` yields nothing and would
          # fall back to "+source". Prefer the commit the runner exports; when it
          # does not (an older runner), fall back to the hash git archive
          # substituted into .ckgit/build-commit via export-subst. The ref, when
          # the runner exports it, tags a deploy build with its deploy tag.
          short=$(printf %s "${CKGIT_COMMIT:-}" | cut -c1-12)
          if [ -z "$short" ] && [ -f .ckgit/build-commit ]; then
            embedded=$(tr -cd '0-9a-f' < .ckgit/build-commit)
            case "$embedded" in ????????????????????????????????????????*) short=$(printf %s "$embedded" | cut -c1-12) ;; esac
          fi
          if [ -n "$short" ]; then ver="$(tr -d '[:space:]' <VERSION)+g$short"; else ver="$(tr -d '[:space:]' <VERSION)+source"; fi
          case "${CKGIT_REF:-}" in refs/tags/*) ver="$ver.${CKGIT_REF#refs/tags/}" ;; esac
          printf '%s\n' "$ver" >"$TMPDIR/build-version"
          printf '%s\n' "$short" >"$TMPDIR/build-commit-short"
          make BUILD_ROOT="$TMPDIR" BUILD_DIR="$TMPDIR/build" CKGIT_BUILD_VERSION="$ver" all
      - name: check
        script: |
          # The full suite, not just the unit binary: `check` also runs every
          # tests/integration/*.sh script, including the ones that bind and
          # connect over loopback. `make` sets CKGIT_TEST_ROOT and each
          # script's own TMPDIR internally; nothing extra is needed here.
          ver=$(cat "$TMPDIR/build-version")
          make BUILD_ROOT="$TMPDIR" BUILD_DIR="$TMPDIR/build" CKGIT_BUILD_VERSION="$ver" check
      - name: package
        script: |
          # The .deb version stays timestamp-led so dpkg orders rebuilds
          # correctly, but carries the commit (from the build step) for
          # traceability back to a build.
          short=$(cat "$TMPDIR/build-commit-short" 2>/dev/null || true)
          pkgver="$(tr -d '[:space:]' <VERSION)+$(date -u +%Y%m%d.%H%M)${short:+.g$short}"
          sh packaging/build-deb.sh --build-dir "$TMPDIR/build" --output "$PWD/dist" --version "$pkgver"
          # A source tarball too, so the macOS client (which cannot run the Pi's
          # Linux binary) can build ckgit from the same release.
          tar -czf "$PWD/dist/ck-git-hosting-src.tar.gz" Makefile VERSION src include packaging
          # The exact baked version, so a client built from the source tarball
          # (which carries no .git) reports the same version as this release.
          cp "$TMPDIR/build-version" "$PWD/dist/build-version"
    artifacts:
      # Not "release": that name is reserved for the tag build's own
      # release.ini record (an artifact of that name would overwrite it).
      name: packages
      paths: [dist]
