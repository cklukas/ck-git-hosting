# ck-git-hosting builds and self-deploys through its own CI runner.
#
# Every push to master runs the full build and test suite: `make check`, the
# unit binary plus every tests/integration/*.sh script, including the ones
# that need loopback networking (the runner brings the sandbox's isolated
# network namespace's loopback interface up for exactly this; the LAN stays
# denied). Pushing a version tag (vMAJOR.MINOR.PATCH, matching the VERSION
# file -- the package step below refuses any tag that does not) does the same
# and, because a tag build publishes a durable release, attaches the built
# Debian packages as release assets, versioned identically to what the GitHub
# release workflow (.github/workflows/release.yml) produces for the same tag
# (WP6/D7): the two channels never disagree about what "v0.1.0" means. An
# administrator installs a release's server package with the packaged
# `ck-git-hosting-deploy` command, which has a health check and automatic
# rollback; see docs/operations/05-releases-and-deploy.md. That command runs
# by hand by default -- the packaged ck-git-hosting-deploy.timer that would
# run it automatically is installed disabled, and enabling it means trusting
# whoever can push a tag here with root on the deploying machine (see that
# timer's own header comment). The CI step itself stays unprivileged: it
# only builds, tests, and packages.
version: 1
on:
  branches: [master]
  tags: [v*]
jobs:
  - name: build-test-package
    steps:
      - name: build
        script: |
          # Stamp a reliable version into the binaries. The sandbox checkout has
          # no .git, so the Makefile's `git describe` yields nothing and would
          # fall back to "+source". Prefer the commit the runner exports; when it
          # does not (an older runner), fall back to the hash git archive
          # substituted into .ckgit/build-commit via export-subst. The ref, when
          # the runner exports it, tags a release build's binaries with its
          # own tag name too, distinct from a plain commit-stamped build.
          short=$(printf %s "${CKGIT_COMMIT:-}" | cut -c1-12)
          if [ -z "$short" ] && [ -f .ckgit/build-commit ]; then
            embedded=$(tr -cd '0-9a-f' < .ckgit/build-commit)
            case "$embedded" in ????????????????????????????????????????*) short=$(printf %s "$embedded" | cut -c1-12) ;; esac
          fi
          if [ -n "$short" ]; then ver="$(tr -d '[:space:]' <VERSION)+g$short"; else ver="$(tr -d '[:space:]' <VERSION)+source"; fi
          case "${CKGIT_REF:-}" in refs/tags/*) ver="$ver.${CKGIT_REF#refs/tags/}" ;; esac
          printf '%s\n' "$ver" >"$TMPDIR/build-version"
          printf '%s\n' "$short" >"$TMPDIR/build-commit-short"
          make BUILD_ROOT="$TMPDIR" BUILD_DIR="$TMPDIR/build" CKGIT_BUILD_VERSION="$ver" all
      - name: check
        script: |
          # The full suite, not just the unit binary: `check` also runs every
          # tests/integration/*.sh script, including the ones that bind and
          # connect over loopback. `make` sets CKGIT_TEST_ROOT and each
          # script's own TMPDIR internally; nothing extra is needed here.
          ver=$(cat "$TMPDIR/build-version")
          make BUILD_ROOT="$TMPDIR" BUILD_DIR="$TMPDIR/build" CKGIT_BUILD_VERSION="$ver" check
      - name: package
        script: |
          # A tag build whose tag matches VERSION exactly publishes the
          # clean release version -- byte-identical to what the GitHub
          # release workflow produces for the same tag, so the two channels
          # never disagree (WP6/D7). Any other tag (this workflow's own
          # trigger already narrowed it to v*, but a future edit to that
          # filter should not silently publish a mismatched release) fails
          # the build, which also means no release is published under it
          # (a failed tag build's release is removed; see the Releases
          # section of docs/operations/04-ci-cd.md). A branch build stays a
          # development snapshot: packaging/build-deb.sh's own default
          # (VERSION~timestamp.commit) sorts below the plain release of the
          # same VERSION, so installing a real release is never seen by dpkg
          # as a downgrade from an earlier snapshot.
          version=$(tr -d '[:space:]' <VERSION)
          short=$(cat "$TMPDIR/build-commit-short" 2>/dev/null || true)
          case "${CKGIT_REF:-}" in
            refs/tags/*)
              tag=${CKGIT_REF#refs/tags/}
              if [ "$tag" != "v$version" ]; then
                echo "package: tag $tag does not match VERSION $version" >&2
                exit 1
              fi
              pkgver="$version"
              ;;
            *)
              pkgver="$version~$(date -u +%Y%m%d.%H%M)${short:+.g$short}"
              ;;
          esac
          sh packaging/build-deb.sh --build-dir "$TMPDIR/build" --output "$PWD/dist" --version "$pkgver"
          # A source tarball too, so the macOS client (which cannot run the Pi's
          # Linux binary) can build ckgit from the same release. LICENSE and
          # README.md ride along so a from-source build is self-explanatory,
          # not just buildable.
          tar -czf "$PWD/dist/ck-git-hosting-src.tar.gz" LICENSE README.md Makefile VERSION src include packaging
          # The exact baked version, so a client built from the source tarball
          # (which carries no .git) reports the same version as this release.
          cp "$TMPDIR/build-version" "$PWD/dist/build-version"
    artifacts:
      # Not "release": that name is reserved for the tag build's own
      # release.ini record (an artifact of that name would overwrite it).
      name: packages
      paths: [dist]
