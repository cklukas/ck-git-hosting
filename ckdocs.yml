# The documentation portal: two sites built together, picked from the
# selector next to the brand. Each site keeps its own configuration:
#   hosting - ck-git-hosting itself      docs/ck-git-hosting.yml
#   ckdocs  - the documentation tool     docs/ckdocs/ckdocs.yml
# The hosting site used to be the whole build, so its old root-level URLs
# redirect to their new place under hosting/.
version: 1
site:
  title: ck-git-hosting
  description: Private Git hosting, continuous integration, and documentation for your server.
  url: https://cklukas.github.io/ck-git-hosting/
  logo: docs/images/ck-git-hosting.svg
  favicon: docs/images/ck-git-hosting.svg
  footer: "© 2026 C. Klukas · MIT License"
  links:
    - title: GitHub
      url: https://github.com/cklukas/ck-git-hosting
      icon: github
home: docs/_portal.md
sites:
  - id: hosting
    title: ck-git-hosting
    description: Private Git hosting, sync, continuous integration and Pages for your own server.
    config: docs/ck-git-hosting.yml
    redirect_from_root: true
  - id: ckdocs
    title: ckdocs
    description: Documentation sites from Markdown — one binary, no dependencies.
    config: docs/ckdocs/ckdocs.yml
